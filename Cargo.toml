[workspace]
resolver = "3"
members = [
    "crates/rf7-voice",
    "crates/rf7-dsp",
    "crates/rf7-analysis",
    "crates/rf7-plugin",
    "crates/rf7-ui",
    "tools/rf7-lab",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
rf7-voice = { path = "crates/rf7-voice" }
rf7-dsp = { path = "crates/rf7-dsp" }
rf7-analysis = { path = "crates/rf7-analysis" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Development checkout, deliberately explicit. See docs/DEVELOPMENT.md.
rackforge-plugin-sdk = { path = "../rackforge/crates/rackforge-plugin-sdk" }
# The host's own validators, used only by tests so the envelopes the plugin
# emits are checked by the code that will receive them.
rackforge-program-api = { path = "../rackforge/crates/rackforge-program-api" }
rackforge-plugin-api = { path = "../rackforge/crates/rackforge-plugin-api" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
