schema_version = 3
id = "org.rackforge.rf7"
name = "RF-7"
short_name = "RF-7"
vendor = "RackForge"
version = "0.3.0"
description = "Six-operator FM instrument: the 32 algorithms, the four-segment envelopes, the cartridges you already own, and a voice editor in every surface"
kind = "instrument"
state_version = 2
capabilities = ["audio_output", "midi_input", "presets", "state"]
ui_layouts = ["little@1"]

[api]
major = 1
minor = 11

# Host-rendered identity: the icon on cards, the banner in the PLAY selector,
# the splash while loading. Display-only PNGs; the host validates them.
[branding]
icon = "branding/icon.png"
banner = "branding/banner.png"
splash = "branding/splash.png"
background_color = "#0B1016"
accent_color = "#55E7FF"

# The PLAY surface: programs, the voice editor and the performance controls
# in one window, drawn by a Rust program compiled to WebAssembly. The glue in
# web/app.js and web/app_bg.wasm is generated by the laboratory before every
# package; play.html and style.css are written by hand.
[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"

# No voice data is shipped. The user installs a cartridge they own, and its
# thirty-two voices become the plugin's thirty-two programs.
[[resources]]
id = "cartridge"
name = "Voice Cartridge"
kind = "file"
required = false
data_path = "cartridges/current.syx"

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"
