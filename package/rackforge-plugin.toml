schema_version = 3
id = "org.rackforge.rf7"
name = "RF-7"
short_name = "RF-7"
vendor = "RackForge"
version = "0.5.0"
description = "Six-operator FM instrument: the 32 algorithms, the four-segment envelopes, the cartridges you already own, and a voice editor in every surface"
kind = "instrument"
state_version = 2
# Sixteen voices the host may render on any of its threads: RF-7 is the
# coordinator of its own block, and each voice a unit that never sees it.
capabilities = ["audio_output", "midi_input", "presets", "state", "parallel_render_v1"]
ui_layouts = ["little@1"]
# The cartridge is installed on its own surface: it is setup, done once, and
# not something to reach for while playing.
config_mode = true

[api]
major = 1
minor = 12

# Host-rendered identity: the icon on cards, the banner in the PLAY selector,
# the splash while loading. Display-only PNGs; the host validates them.
[branding]
icon = "branding/icon.png"
banner = "branding/banner.png"
splash = "branding/splash.png"
background_color = "#0B1016"
accent_color = "#55E7FF"

# The PLAY surface: programs, the voice editor and the performance controls
# in one window, drawn by a Rust program compiled to WebAssembly. The glue in
# web/app.js and web/app_bg.wasm is generated by the laboratory before every
# package; play.html and style.css are written by hand.
[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"

[[web_ui.surfaces]]
kind = "config"
entry = "web/config.html"

# No voice data is shipped. The user installs the cartridges they own, and
# their voices become the plugin's programs. Eight bays, so a rack of them
# plays at once rather than one at a time; the first keeps the name RF-7
# has always declared, so a cartridge installed before there were bays
# stays where it is.
[[resources]]
id = "cartridge"
name = "Cartridge Bay 1"
kind = "file"
required = false
data_path = "cartridges/current.syx"

[[resources]]
id = "cartridge-2"
name = "Cartridge Bay 2"
kind = "file"
required = false
data_path = "cartridges/bay-2.syx"

[[resources]]
id = "cartridge-3"
name = "Cartridge Bay 3"
kind = "file"
required = false
data_path = "cartridges/bay-3.syx"

[[resources]]
id = "cartridge-4"
name = "Cartridge Bay 4"
kind = "file"
required = false
data_path = "cartridges/bay-4.syx"

[[resources]]
id = "cartridge-5"
name = "Cartridge Bay 5"
kind = "file"
required = false
data_path = "cartridges/bay-5.syx"

[[resources]]
id = "cartridge-6"
name = "Cartridge Bay 6"
kind = "file"
required = false
data_path = "cartridges/bay-6.syx"

[[resources]]
id = "cartridge-7"
name = "Cartridge Bay 7"
kind = "file"
required = false
data_path = "cartridges/bay-7.syx"

[[resources]]
id = "cartridge-8"
name = "Cartridge Bay 8"
kind = "file"
required = false
data_path = "cartridges/bay-8.syx"

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"
